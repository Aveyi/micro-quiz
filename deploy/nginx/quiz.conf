# Формат access-лога: какой инстанс live (upstream) обслужил какую комнату
# (room) — так видно, что hash $arg_room держит комнату на одном инстансе.
# upstream — IP:порт; чей это IP: `getent hosts live1 live2` внутри nginx.
# Строка WebSocket пишется при ЗАКРЫТИИ соединения, time — его длительность.
# Заголовок Authorization (токен ведущего) не логируем: это секрет.
log_format quiz '$time_local $remote_addr "$request" $status '
                'room=$arg_room upstream=$upstream_addr time=${request_time}s';

upstream content {
	server content:8000;
}

upstream live_ws {
	hash $arg_room consistent;
	server live1:8080;
	server live2:8080;
}

upstream live {
	server live1:8080;
	server live2:8080;
}

server {
	listen 8000;
	# В образе nginx этот файл — ссылка на вывод контейнера:
	# строки видны в `docker compose logs nginx`.
	access_log /var/log/nginx/access.log quiz;

	location /api/ {
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://content;	
	}
	location /live/api/ {
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://live;
	}
	location /live/ws {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection upgrade;
		proxy_read_timeout 80;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://live_ws;
	}
}
